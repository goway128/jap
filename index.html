<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>just a page</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="justapage" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      background: #0a0e0a;
      overflow-x: hidden;
      color: #00ff41;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,255,65,0.03) 2px, rgba(0,255,65,0.03) 4px
      );
      pointer-events: none; z-index: 9997;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
      pointer-events: none; z-index: 9996;
    }

    /* ══ Hero ══ */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; text-align: center;
      padding: 2rem; gap: 40px; position: relative; z-index: 1;
    }

    /* ══ 终端窗口 ══ */
    .terminal-window {
      background: rgba(0,8,0,0.9);
      border: 1px solid #00ff41;
      border-radius: 8px;
      width: 100%; max-width: 560px;
      box-shadow: 0 0 40px rgba(0,255,65,0.15), 0 0 80px rgba(0,255,65,0.05);
      overflow: hidden;
    }
    .terminal-titlebar {
      background: rgba(0,20,0,0.8);
      border-bottom: 1px solid rgba(0,255,65,0.2);
      padding: 8px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-dot.red    { background: #ff5f57; box-shadow: 0 0 4px #ff5f57; }
    .terminal-dot.yellow { background: #febc2e; box-shadow: 0 0 4px #febc2e; }
    .terminal-dot.green  { background: #28c840; box-shadow: 0 0 4px #28c840; }
    .terminal-title {
      flex: 1; text-align: center; font-size: .7rem;
      color: rgba(0,255,65,0.4);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .1em;
    }
    .terminal-body {
      padding: 20px 24px 24px; text-align: left;
    }
    .terminal-prompt {
      color: rgba(0,255,65,0.4); font-size: .8rem; margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .terminal-prompt span { color: #00ff41; }
    .terminal-sub {
      margin-top: 12px; font-size: .9rem;
      color: rgba(0,255,65,0.55);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .03em; line-height: 1.6;
    }
    .terminal-sub::before { content: '// '; color: rgba(0,255,65,0.25); }

    /* ══ 打字机 ══ */
    .typewriter-title {
      font-size: clamp(1.6rem,5vw,2.8rem); font-weight: 700; color: #00ff41;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em; line-height: 1.2;
      text-shadow: 0 0 20px rgba(0,255,65,0.5);
      min-height: 1.4em;
      display: flex; align-items: center;
    }
    .cursor-blink {
      display: inline-block; width: 2px; height: 1em;
      background: #00ff41; margin-left: 4px;
      animation: blink .7s step-end infinite;
      box-shadow: 0 0 6px rgba(0,255,65,0.8);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ══ 图标滚动墙 ══ */
    .scroll-terminal .terminal-body {
      padding: 16px 0 20px;
      overflow: hidden;
    }
    .scroll-terminal .terminal-prompt { padding-left: 24px; }
    .scroll-terminal .terminal-sub { padding-left: 24px; }
    .scroll-track {
      display: flex; width: max-content; gap: 20px; padding: 12px 0;
    }
    .scroll-row { overflow: hidden; position: relative; }
    .scroll-row::before, .scroll-row::after {
      content: '';
      position: absolute; top: 0; bottom: 0; width: 60px;
      z-index: 2; pointer-events: none;
    }
    .scroll-row::before { left: 0; background: linear-gradient(to right, rgba(0,8,0,0.95), transparent); }
    .scroll-row::after  { right: 0; background: linear-gradient(to left, rgba(0,8,0,0.95), transparent); }
    .scroll-track.left  { animation: scrollLeft  25s linear infinite; }
    .scroll-track.right { animation: scrollRight 25s linear infinite; }
    .scroll-track:hover { animation-play-state: paused; }
    @keyframes scrollLeft  { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    @keyframes scrollRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }
    .icon-card {
      flex-shrink: 0; width: 64px; height: 64px;
      background: rgba(0,15,0,0.9);
      border: 1px solid rgba(0,255,65,0.2); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 4px;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      cursor: default;
    }
    .icon-card:hover {
      border-color: #00ff41;
      box-shadow: 0 0 16px rgba(0,255,65,0.3);
      transform: translateY(-4px);
    }
    .icon-card svg {
      width: 28px; height: 28px;
      stroke: #00ff41; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 3px rgba(0,255,65,0.4));
    }
    .icon-card .icon-label {
      font-size: .45rem; color: rgba(0,255,65,0.5);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em;
    }

    /* ══ 假终端交互 ══ */
    .fake-term-body { padding: 16px 24px 20px; }
    .fake-term-output {
      min-height: 120px; max-height: 220px; overflow-y: auto;
      margin-bottom: 12px; font-size: .78rem; line-height: 1.7;
      color: rgba(0,255,65,0.7);
    }
    .fake-term-output::-webkit-scrollbar { width: 4px; }
    .fake-term-output::-webkit-scrollbar-track { background: transparent; }
    .fake-term-output::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.3); border-radius: 2px; }
    .fake-term-output .out-line { opacity: 0; animation: fadeLine .3s forwards; }
    @keyframes fadeLine { to { opacity: 1; } }
    .fake-term-output .out-cmd  { color: #00ff41; }
    .fake-term-output .out-info { color: rgba(0,255,65,0.5); }
    .fake-term-output .out-err  { color: #ff5f57; }
    .fake-term-input-row {
      display: flex; align-items: center; gap: 6px;
      border-top: 1px solid rgba(0,255,65,0.15); padding-top: 10px;
    }
    .fake-term-input-row label { color: #00ff41; font-size: .8rem; white-space: nowrap; }
    .fake-term-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #00ff41; font-family: 'JetBrains Mono', monospace;
      font-size: .8rem; caret-color: #00ff41;
    }

    /* ★ 新增：页面信息 Footer */
    .site-footer {
      position: relative; z-index: 1;
      border-top: 1px solid rgba(0,255,65,0.1);
      padding: 32px 24px 40px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;
    }
    .footer-line {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex-wrap: wrap;
      font-size: .72rem; color: rgba(0,255,65,0.35);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em;
    }
    .footer-line a {
      color: rgba(0,255,65,0.5);
      text-decoration: none;
      transition: color .2s, text-shadow .2s;
    }
    .footer-line a:hover {
      color: #00ff41;
      text-shadow: 0 0 8px rgba(0,255,65,0.5);
    }
    .cf-icon {
      display: inline-block; width: 18px; height: 14px;
      vertical-align: middle; fill: rgba(0,255,65,0.5);
      transition: fill .2s, filter .2s;
    }
    .footer-line a:hover .cf-icon {
      fill: #00ff41;
      filter: drop-shadow(0 0 4px rgba(0,255,65,0.6));
    }
    .footer-divider {
      width: 40px; height: 1px;
      background: rgba(0,255,65,0.1);
    }

    /* ══ 矩阵雨 ══ */
    #matrix-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; opacity: 0.07;
    }
  </style>
</head>

<script>
/* ══ 矩阵雨 ══ */
(function(){
  var canvas = document.getElementById('matrix-canvas');
  var ctx = canvas.getContext('2d');
  var cols, drops;
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>/\\|{}[]';
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = [];
    for(var i = 0; i < cols; i++) drops[i] = 1;
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(function(){
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '14px monospace';
    for(var i = 0; i < drops.length; i++){
      var ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, drops[i] * 16);
      if(drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);
})();

/* ══ 打字机 ══ */
(function(){
  var text = 'Just a page';
  var el = document.getElementById('typewriterText');
  var i = 0;
  function type(){
    if(i <= text.length){
      el.textContent = text.substring(0, i);
      i++;
      setTimeout(type, 120);
    }
  }
  setTimeout(type, 800);
})();

/* ══ 图标滚动墙 ══ */
(function(){
  var row1Icons = [
    { label:'HTML',   svg:'<svg viewBox="0 0 24 24"><path d="M4 2l1.6 18L12 22l6.4-2L20 2H4z"/><path d="M16 8H8l.5 4h7l-.5 5-3 1-3-1-.2-2"/></svg>' },
    { label:'CSS',    svg:'<svg viewBox="0 0 24 24"><path d="M4 2l1.6 18L12 22l6.4-2L20 2H4z"/><path d="M16 8H8l.2 3h7.2l-.5 5-3 1-3-1-.1-2"/></svg>' },

    { label:'Python', svg:'<svg viewBox="0 0 24 24"><path d="M12 2c-3 0-5 1.5-5 4v2h5v1H6c-2 0-4 1.5-4 5s1 5 3 5h2v-3c0-2 1-4 4-4h5c2 0 3-1 3-3V6c0-2-2-4-5-4z"/><circle cx="9.5" cy="5.5" r="1" fill="#00ff41" stroke="none"/><path d="M12 22c3 0 5-1.5 5-4v-2h-5v-1h6c2 0 4-1.5 4-5s-1-5-3-5h-2v3c0 2-1 4-4 4h-5c-2 0-3 1-3 3v3c0 2 2 4 5 4z"/><circle cx="14.5" cy="18.5" r="1" fill="#00ff41" stroke="none"/></svg>' },
    { label:'React',  svg:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>' },

    { label:'Git',    svg:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v10M8 6h8M18 8v4c0 2-2 4-4 4H6"/></svg>' },
    { label:'Docker', svg:'<svg viewBox="0 0 24 24"><rect x="2" y="10" width="4" height="3" rx=".5"/><rect x="7" y="10" width="4" height="3" rx=".5"/><rect x="12" y="10" width="4" height="3" rx=".5"/><rect x="7" y="6" width="4" height="3" rx=".5"/><rect x="12" y="6" width="4" height="3" rx=".5"/><rect x="17" y="10" width="4" height="3" rx=".5"/><rect x="12" y="2" width="4" height="3" rx=".5"/><path d="M1 14c1 5 5 8 11 8 7 0 10-5 11-8"/></svg>' },
    { label:'Linux',  svg:'<svg viewBox="0 0 24 24"><path d="M12 2C9 2 7 5 7 9c0 2-.5 3-2 5s-2 4 0 5c1 .5 2 0 3-1s2-1 4-1 3 0 4 1 2 1.5 3 1c2-1 1.5-3 0-5s-2-3-2-5c0-4-2-7-5-7z"/><circle cx="10" cy="8" r="1" fill="#00ff41" stroke="none"/><circle cx="14" cy="8" r="1" fill="#00ff41" stroke="none"/><path d="M10 11c1 1 3 1 4 0"/></svg>' },
    { label:'Vim',    svg:'<svg viewBox="0 0 24 24"><path d="M3 2v20l9-10L3 2z"/><path d="M13 7h8M13 12h8M13 17h5"/></svg>' },
  ];
  var row2Icons = [
    { label:'GitHub', svg:'<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.8.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.2-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.4 9.4 0 015 0c1.8-1.3 2.7-1 2.7-1 .5 1.3.2 2.4.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0022 12c0-5.5-4.5-10-10-10z"/></svg>' },
    { label:'Twitter',svg:'<svg viewBox="0 0 24 24"><path d="M4 4l6.5 8.5L4 20h2l5.5-6.2L16 20h5l-7-9 6-7h-2l-5 5.7L9 4H4z"/></svg>' },

    { label:'Mail',   svg:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 5l9 7 9-7"/></svg>' },
    { label:'RSS',    svg:'<svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2" fill="#00ff41" stroke="none"/><path d="M4 11c4.5 0 9 3.5 9 9"/><path d="M4 4c9 0 16 7 16 16"/></svg>' },
    { label:'API',    svg:'<svg viewBox="0 0 24 24"><path d="M4 12h4m8 0h4"/><circle cx="12" cy="12" r="4"/><path d="M12 4v4m0 8v4"/></svg>' },
    { label:'DB',     svg:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 10c0 1.7 3.6 3 8 3s8-1.3 8-3"/><path d="M4 15c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>' },
    { label:'Cloud',  svg:'<svg viewBox="0 0 24 24"><path d="M6 19a4 4 0 01-.5-7.97A7 7 0 0118.5 11 4.5 4.5 0 0119 19H6z"/></svg>' },
    { label:'Term',   svg:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8l4 4-4 4M13 16h4"/></svg>' },
    { label:'Code',   svg:'<svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></svg>' },
  ];
  function buildTrack(icons, direction){
    var all = icons.concat(icons);
    var track = document.createElement('div');
    track.className = 'scroll-track ' + direction;
    all.forEach(function(icon){
      var card = document.createElement('div');
      card.className = 'icon-card';
      card.innerHTML = icon.svg + '<span class="icon-label">' + icon.label + '</span>';
      track.appendChild(card);
    });
    return track;
