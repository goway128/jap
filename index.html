<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BubbleMenu — 白の小站</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="justapage" />
<link rel="manifest" href="/site.webmanifest" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      background: #0a0e0a;
      overflow-x: hidden;
      color: #00ff41;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,255,65,0.03) 2px, rgba(0,255,65,0.03) 4px
      );
      pointer-events: none; z-index: 9997;
    }body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent60%, rgba(0,0,0,0.7) 100%);
      pointer-events: none; z-index: 9996;
    }

    /*══ Nav Bar ══ */
    .bubble-menu {
      left: 0; right: 0; top: 2em;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 0 2em; pointer-events: none; z-index: 200;
    }
    .bubble-menu.absolute { position: absolute; }
    .bubble-menu .bubble {
      --bubble-size: 48px;
      height: var(--bubble-size); border-radius: 8px;
      background: rgba(0,10,0,0.9);
      border: 1px solid #00ff41;
      box-shadow: 0 0 12px rgba(0,255,65,0.3), inset 0 0 8px rgba(0,255,65,0.05);
      display: inline-flex; align-items: center; justify-content: center;
      pointer-events: auto; will-change: transform;
    }
    .bubble-menu .lang-bubble {
      padding: 0 14px; gap: 7px; cursor: pointer;
      white-space: nowrap; min-width: var(--bubble-size);}
    .bubble-menu .lang-bubble-icon { flex-shrink: 0; opacity: .6; }
    .bubble-menu .lang-bubble-label {
      font-size: .75rem; font-weight: 700; color: #00ff41;
      letter-spacing: .1em; font-family: 'JetBrains Mono', monospace;
    }
    .bubble-menu .font-bubble { width: var(--bubble-size); cursor: pointer; }
    .bubble-menu .font-bubble-label {
      font-size: .85rem; font-weight: 700; color: #00ff41;
      pointer-events: none; font-family: 'JetBrains Mono', monospace;
    }
    .bubble-menu .toggle-bubble { width: var(--bubble-size); }
    .bubble-menu .menu-btn {
      border: none; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 0; outline: none; width: 100%; height: 100%;
    }
    .bubble-menu .menu-line {
      width: 20px; height: 1.5px; background: #00ff41; border-radius: 0; display: block;
      transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .35s ease;
      transform-origin: center;
      box-shadow: 0 0 4px rgba(0,255,65,0.6);
    }
    .bubble-menu .menu-line + .menu-line { margin-top: 5px; }
    .bubble-menu .menu-btn.open .menu-line:first-child { transform: translateY(3.5px) rotate(45deg); }
    .bubble-menu .menu-btn.open .menu-line:last-child  { transform: translateY(-3.5px) rotate(-45deg); }
    @media (min-width: 768px) { .bubble-menu .bubble { --bubble-size: 52px; } }

    /* ══ Popup panels ══ */
    .popup-panel {
      position: fixed; z-index: 10000;
      background: rgba(0,8,0,0.97);
      border: 1px solid #00ff41; border-radius: 6px;
      padding: 6px; flex-direction: column; gap: 2px;
      box-shadow: 0 0 20px rgba(0,255,65,0.25); min-width: 140px;
      display: flex; opacity: 0; transform: translateY(-8px) scale(.95);
      pointer-events: none; transform-origin: top center;
      transition: opacity .2s ease, transform .2s ease;
    }
    .popup-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .panel-opt {
      padding: 7px 14px; border-radius: 4px; font-size: .78rem;
      cursor: pointer; transition: background .12s, color .12s; color: #00cc33;
      border: none; background: transparent; text-align: left;
      font-family: 'JetBrains Mono', monospace; letter-spacing: .05em;
    }
    .panel-opt::before { content: '> '; opacity: 0; transition: opacity .12s; }
    .panel-opt:hover::before, .panel-opt.active::before { opacity: 1; }
    .panel-opt:hover { background: rgba(0,255,65,0.08); color: #00ff41; }
    .panel-opt.active { color: #00ff41; background: rgba(0,255,65,0.12); }
    .panel-opt[data-font="serif"]{ font-family: serif; }
    .panel-opt[data-font="sans"]{ font-family: sans-serif; }
    .panel-opt[data-font="zhengsung"] { font-family: "TW-Sung", serif; }

    /* ══ Overlay / Pills ══ */
    .bubble-menu-items {
      inset: 0; display: none; align-items: center; justify-content: center;
      pointer-events: none; z-index: 98;background: rgba(0,5,0,0.93);}
    .bubble-menu-items.absolute { position: absolute; }
    .bubble-menu-items .pill-list {
      list-style: none; padding: 0 24px; display: flex; flex-wrap: wrap;
      gap: 0; row-gap: 6px; width: 100%; max-width: 1200px;
      margin: 0 auto; pointer-events: auto; justify-content: stretch;
    }
    .bubble-menu-items .pill-col {
      display: flex; justify-content: center; align-items: stretch; flex: 0 0 calc(100% / 3);
    }
    .bubble-menu-items .pill-col:nth-child(4):nth-last-child(2) { margin-left: calc(100% / 6); }
    .bubble-menu-items .pill-col:nth-child(4):last-child         { margin-left: calc(100% / 3); }
    .bubble-menu-items .pill-link {
      --pill-bg: rgba(0,12,0,0.9); --pill-color: #00ff41;
      --item-rot: 0deg; --pill-min-h: 140px;
      --active-bg: rgba(0,255,65,0.12); --active-color: #00ff41;
      width: 100%; min-height: var(--pill-min-h);
      padding: clamp(1.5rem,3vw,6rem) 0; font-size: clamp(1.2rem,3.5vw,3.5rem);
      font-weight: 700; line-height: 0; border-radius: 6px;
      background: var(--pill-bg); color: var(--pill-color);
      border: 1px solid rgba(0,255,65,0.25);
      box-shadow: 0 0 20px rgba(0,255,65,0.06);
      display: flex; align-items: center; justify-content: center;
      transition: background .3s, border-color .3s, box-shadow .3s;
      will-change: transform; white-space: nowrap; overflow: hidden;
      height: 10px; outline: none; cursor: pointer; user-select: none;
      font-family: 'JetBrains Mono', monospace; letter-spacing: .05em;
    }
    .bubble-menu-items .pill-link.pill-active {
      background: var(--active-bg) !important;
      border-color: #00ff41 !important;
      box-shadow: 0 0 30px rgba(0,255,65,0.2) !important;
    }
    .bubble-menu-items .pill-label {
      display: inline-block; will-change: transform, opacity; height: 1.2em; line-height: 1.2;
    }
    @media (min-width: 900px) {
      .bubble-menu-items .pill-link { transform: rotate(var(--item-rot)); }
      .bubble-menu-items .pill-link.pill-active { transform: rotate(var(--item-rot)) scale(1.02); }
      .bubble-menu-items .pill-link:active { transform: rotate(var(--item-rot)) scale(.96); }
    }
    @media (max-width: 899px) {
      .bubble-menu-items { align-items: flex-start; padding-top: 120px; }
      .bubble-menu-items .pill-list { row-gap: 10px; }
      .bubble-menu-items .pill-col  { flex: 0 0 100%; margin-left: 0 !important; overflow: visible; }
      .bubble-menu-items .pill-link { font-size: clamp(1rem,3vw,3rem); padding: clamp(1rem,2vw,2rem) 0; min-height: 72px; }
      .bubble-menu-items .pill-link.pill-active { transform: scale(1.02); }
      .bubble-menu-items .pill-link:active { transform: scale(.96); }
    }

    /* ══ Hero ══ */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; text-align: center;
      padding: 2rem; gap: 16px; position: relative; z-index: 1;
    }

    /*终端窗口 */
    .terminal-window {
      background: rgba(0,8,0,0.9); border: 1px solid #00ff41; border-radius: 8px;
      width: 100%; max-width: 560px;
      box-shadow: 0 0 40px rgba(0,255,65,0.15), 0 0 80px rgba(0,255,65,0.05);
      overflow: hidden;}
    .terminal-titlebar {
      background: rgba(0,20,0,0.8); border-bottom: 1px solid rgba(0,255,65,0.2);
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    }
    .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-dot.red{ background: #ff5f57; box-shadow: 0 0 4px #ff5f57; }
    .terminal-dot.yellow { background: #febc2e; box-shadow: 0 0 4px #febc2e; }
    .terminal-dot.green  { background: #28c840; box-shadow: 0 0 4px #28c840; }
    .terminal-title {
      flex: 1; text-align: center; font-size: .7rem;
      color: rgba(0,255,65,0.4); font-family: 'JetBrains Mono', monospace; letter-spacing: .1em;
    }
    .terminal-body { padding: 20px 24px 24px; text-align: left; }
    .terminal-prompt {
      color: rgba(0,255,65,0.4); font-size: .8rem; margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .terminal-prompt span { color: #00ff41; }
    .typewriter-title {
      font-size: clamp(1.6rem,5vw,2.8rem); font-weight: 700; color: #00ff41;
      font-family: 'JetBrains Mono', monospace; letter-spacing: .05em; line-height: 1.2;
      text-shadow: 0 0 20px rgba(0,255,65,0.5); min-height: 1.4em;
      display: flex; align-items: center;}
    .cursor-blink {
      display: inline-block; width: 2px; height: 1em;
      background: #00ff41; margin-left: 4px; vertical-align: middle;
      animation: blink .7s step-end infinite;
      box-shadow: 0 0 6px rgba(0,255,65,0.8);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .terminal-sub {
      margin-top: 12px; font-size: .9rem; color: rgba(0,255,65,0.55);
      font-family: 'JetBrains Mono', monospace; letter-spacing: .03em; line-height: 1.6;
    }
    .terminal-sub::before { content: '// '; color: rgba(0,255,65,0.25); }

    /* ══ Dock ══ */
    .dock-section { display: flex; justify-content: center; align-items: center; padding: 32px 24px 0; }
    .dock-outer { display: flex; align-items: flex-end; justify-content: center; height: 110px; }
    .dock-panel {
      display: flex; align-items: flex-end; gap: 8px;
      background: rgba(0,8,0,0.85); border: 1px solid rgba(0,255,65,0.3);
      border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 0 24px rgba(0,255,65,0.1);
    }
    .dock-item {
      position: relative; display: inline-flex; align-items: center;
      justify-content: center; border-radius: 6px;
      background: rgba(0,15,0,0.9); border: 1px solid rgba(0,255,65,0.2);
      box-shadow: 0 0 8px rgba(0,255,65,0.05);
      cursor: pointer; outline: none; width: 52px; height: 52px; flex-shrink: 0;
      transition: border-color .2s, box-shadow .2s;}
    .dock-item:hover { border-color: rgba(0,255,65,0.7); box-shadow: 0 0 16px rgba(0,255,65,0.2); }
    .dock-item svg {
      width: 48%; height: 48%; stroke: #00ff41; fill: none;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
      filter: drop-shadow(0 0 3px rgba(0,255,65,0.4));
    }
    .dock-label {
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(0,8,0,0.95); border: 1px solid rgba(0,255,65,0.4);
      color: #00ff41; font-size: .68rem; padding: 4px 10px; border-radius: 4px;
      white-space: nowrap; pointer-events: none; opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
      font-family: 'JetBrains Mono', monospace; letter-spacing: .08em;
    }
    .dock-label::before { content: '> '; opacity: .5; }
    .dock-item:hover .dock-label { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 矩阵雨 */
    #matrix-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; opacity: 0.07;
    }
  </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- Nav bar -->
<nav class="bubble-menu absolute" aria-label="主导航">
  <div id="langBubble" class="bubble lang-bubble" role="button" tabindex="0">
    <svg class="lang-bubble-icon" width="14" height="14" fill="none" stroke="#00ff41" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 00020"/>
    </svg>
    <span class="lang-bubble-label" id="langBubbleLabel">简中</span>
  </div>
  <div id="fontBubble" class="bubble font-bubble" role="button" tabindex="0">
    <span class="font-bubble-label" id="fontBubbleLabel">宋</span>
  </div>
  <button type="button" id="menuToggle" class="bubble toggle-bubble" aria-pressed="false">
    <div class="menu-btn" id="menuBtn">
      <span class="menu-line"></span>
      <span class="menu-line"></span></div>
  </button>
</nav>

<div id="langPanel" class="popup-panel">
  <button class="panel-opt active" data-lang="zh">简体中文</button>
  <button class="panel-opt" data-lang="en">English</button>
</div>
<div id="fontPanel" class="popup-panel">
  <button class="panel-opt active" data-font="serif">思源宋体</button>
  <button class="panel-opt" data-font="sans">思源黑体</button><button class="panel-opt" data-font="zhengsung">全字库正宋体</button>
</div>

<div id="bubbleOverlay" class="bubble-menu-items absolute" aria-hidden="true">
  <ul class="pill-list" role="menu"></ul>
</div>

<main class="hero">
  <div class="terminal-window">
    <div class="terminal-titlebar">
      <div class="terminal-dot red"></div>
      <div class="terminal-dot yellow"></div>
      <div class="terminal-dot green"></div>
      <div class="terminal-title">bash — 80×24</div>
    </div>
    <div class="terminal-body">
      <div class="terminal-prompt">
        <span>root@goway</span>:~$&nbsp;echo "Just a page"
      </div>
      <div class="typewriter-title">
        <span id="typewriterText"></span><span class="cursor-blink"></span>
      </div>
      <div class="terminal-sub" id="heroSub">这只是个页面</div>
    </div>
  </div>

  <div class="dock-section">
    <div class="dock-outer">
      <div class="dock-panel" id="dockPanel"></div>
    </div></div>
</main>

<script>
/*══ 矩阵雨 ══ */
(function(){
  var canvas = document.getElementById('matrix-canvas');
  var ctx = canvas.getContext('2d');
  var cols, drops;
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>/\\|{}[]';
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = [];
    for(var i=0;i<cols;i++) drops[i]=1;
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(function(){
    ctx.fillStyle='rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ff41';
    ctx.font='14px monospace';
    for(var i=0;i<drops.length;i++){
      var ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch,i*16,drops[i]*16);
      if(drops[i]*16>canvas.height&&Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  },50);
})();

/* ══ 主逻辑 —— 等GSAP 确认加载后再执行 ══ */
window.addEventListener('load', function(){

  var ITEMS = [
    { key:'home',rotation:-8, activeColor:'rgba(0,255,65,0.15)' },
    { key:'categories',rotation: 8, activeColor:'rgba(0,255,65,0.15)' },
    { key:'tags',      rotation: 8, activeColor:'rgba(0,255,65,0.15)' },
    { key:'archives',  rotation: 8, activeColor:'rgba(0,255,65,0.15)' },
    { key:'about',     rotation:-8, activeColor:'rgba(0,255,65,0.15)' },
  ];
  var I18N = {
    zh:{ home:'首页', categories:'分类', tags:'标签', archives:'归档', about:'关于', badge:'简中', heroSub:'这只是个页面' },
    en:{ home:'Home', categories:'Categories', tags:'Tags', archives:'Archives', about:'About', badge:'EN', heroSub:'This is just a page' },
  };
  var FONTS = {
    serif:{ family:'"Source Han Serif SC","Source Han Serif",serif', label:'宋' },
    sans:      { family:'"Source Han Sans SC","Source Han Sans",sans-serif', label:'黑' },
    zhengsung: { family:'"TW-Sung",serif', label:'正' },
  };
  var DOCK_DATA = [
    { zh:'首页', en:'Home',icon:'home'},
    { zh:'分类', en:'Categories', icon:'grid'    },
    { zh:'标签', en:'Tags',       icon:'tag'     },
    { zh:'归档', en:'Archives',   icon:'archive' },
    { zh:'关于', en:'About',      icon:'user'    },
  ];
  var ICONS = {
    home:    '<svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',
    grid:    '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    tag:     '<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5" fill="#00ff41" stroke="none"/></svg>',
    archive: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="4" rx="1"/><path d="M4 8v11a1 1 0 001 1h14a1 1 0 001-1V8"/><path d="M10 12h4"/></svg>',
    user:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  };

  var MENU_BG= 'rgba(0,12,0,0.9)';
  var MENU_COLOR = '#00ff41';
  var EASE= 'back.out(1.5)';
  var DUR= 0.45;
  var STAGGER    = 0.09;

  /* ── 面板工具 ── */
  function positionPanel(panel, anchor){
    var r = anchor.getBoundingClientRect();
    var pw = panel.offsetWidth || 140;
    var left = Math.max(8, Math.min(r.left + r.width/2 - pw/2, window.innerWidth - pw - 8));
    panel.style.left = left + 'px';
    panel.style.top  = (r.bottom + 10) + 'px';
  }
  function openPanel(panel, anchor){ closeAllPanels(); positionPanel(panel, anchor); panel.classList.add('open'); }
  function closeAllPanels(){
    document.querySelectorAll('.popup-panel').forEach(function(p){ p.classList.remove('open'); });
  }
  document.addEventListener('click', closeAllPanels);
  document.querySelectorAll('.popup-panel').forEach(function(p){
    p.addEventListener('click', function(e){ e.stopPropagation(); });
  });

  /* ── Pills ── */
  var pillList = document.querySelector('.pill-list');
  var bubbles = [], labels = [], pillEls = [];
  ITEMS.forEach(function(item){
    var li  = document.createElement('li');
    li.className = 'pill-col'; li.setAttribute('role','none');
    var div = document.createElement('div');
    div.className = 'pill-link';
    div.setAttribute('role','menuitem'); div.setAttribute('tabindex','0');
    div.style.setProperty('--item-rot', item.rotation + 'deg');
    div.style.setProperty('--pill-bg',MENU_BG);
    div.style.setProperty('--pill-color',  MENU_COLOR);
    div.style.setProperty('--active-bg',   item.activeColor);
    div.style.setProperty('--active-color','#00ff41');
    var span = document.createElement('span');
    span.className = 'pill-label';
    div.appendChild(span); li.appendChild(div); pillList.appendChild(li);
    bubbles.push(div); labels.push(span); pillEls.push(div);
    div.addEventListener('click', function(){
      var was = div.classList.contains('pill-active');
      pillEls.forEach(function(el){ el.classList.remove('pill-active'); });
      if(!was) div.classList.add('pill-active');
    });
    div.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' ') div.click();
    });
  });

  /* ── 语言切换 ── */
  var curLang = localStorage.getItem('chirpy-lang') || 'zh';
  function applyLang(lang){
    var map = I18N[lang] || I18N.zh;
    labels.forEach(function(s,i){ s.textContent = map[ITEMS[i].key]; });
    document.getElementById('langBubbleLabel').textContent = map.badge;
    document.getElementById('heroSub').textContent         = map.heroSub;document.querySelectorAll('[data-lang]').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    dockEls.forEach(function(item){
      var label = item.el.querySelector('.dock-label');
      if(label) label.textContent = lang==='en' ? ite
